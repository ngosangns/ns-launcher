version: '3'

vars:
  APP_NAME: NSLauncher
  # Must match CFBundleExecutable in Resources/Info.plist.
  BIN_NAME: NSLauncher
  BIN_PATH:
    sh: swift build -c release --show-bin-path

tasks:
  dev:
    desc: Rebuild and relaunch NS Launcher when Swift sources change.
    cmds:
      - task --watch --force dev:run

  dev:run:
    run: always
    sources:
      - Sources/**/*.swift
      - Package.swift
    cmds:
      # See scripts/dev-run.sh for why a plain pkill-then-run here is not enough
      # (task --watch runs overlapping dev:run cycles, not one-at-a-time).
      - ./scripts/dev-run.sh

  build:
    desc: Build the optimized release binary.
    cmds:
      - swift build -c release

  bundle:
    desc: Build release and assemble {{.APP_NAME}}.app in .build/release.
    deps: [build]
    cmds:
      # Shared with .github/workflows/release.yml — see the script's header for
      # why these steps are not written out twice.
      - ./scripts/bundle-app.sh

  install:
    desc: Bundle and move {{.APP_NAME}}.app into /Applications.
    deps: [bundle]
    cmds:
      - rm -rf '/Applications/{{.APP_NAME}}.app'
      - ditto '{{.BIN_PATH}}/{{.APP_NAME}}.app' '/Applications/{{.APP_NAME}}.app'
      - codesign --verify --strict '/Applications/{{.APP_NAME}}.app'

  screenshots:
    desc: Launch the app, start the game, and capture screenshots into Screenshots/.
    cmds:
      - ./scripts/capture-screenshots.sh
