name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  APP_NAME: NSLauncher
  BIN_NAME: NSLauncher

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest available Xcode
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n1)
          if [ -n "$LATEST_XCODE" ]; then
            sudo xcode-select -s "$LATEST_XCODE"
          fi

      - name: Show Swift/Xcode version
        run: |
          swift --version
          xcodebuild -version

      - name: Build release binary
        run: swift build -c release

      - name: Assemble app bundle
        # Shared with Taskfile.yml's `bundle` task. This step used to spell the
        # same steps out by hand and drifted from it — it never copied SwiftPM's
        # resource bundle, so released builds shipped with an empty Story tab.
        run: |
          APP_BUNDLE="$(./scripts/bundle-app.sh "${GITHUB_REF_NAME#v}")"
          echo "APP_BUNDLE=$APP_BUNDLE" >> "$GITHUB_ENV"

      - name: Archive app bundle
        run: |
          ARCHIVE="$APP_NAME-${GITHUB_REF_NAME}-macos.tar.gz"
          tar -C "$(dirname "$APP_BUNDLE")" -zcf "$ARCHIVE" "$(basename "$APP_BUNDLE")"
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "NS Launcher ${{ github.ref_name }}"
          generate_release_notes: true
          files: ${{ env.ARCHIVE }}
